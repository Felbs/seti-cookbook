# CPU-only self-tests: no GPU, no turboSETI; the only download is the 50 MB
# Voyager 1 calibration file (cached between runs).
name: selftests
on: [push, pull_request]
jobs:
  selftests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (CPU only)
        run: pip install numpy scipy h5py hdf5plugin astropy matplotlib pandas setigen "setuptools<81"
      - name: no data files in git
        run: |
          bad=$(git ls-files | grep -E '\.(h5|fil|npz|dat|fits)$|^data/' || true)
          big=$(git ls-files -z | xargs -0 du -k | awk '$1 > 3072 {print $2}')
          if [ -n "$bad$big" ]; then echo "data or >3 MB files tracked (targets.json is ~2.3 MB by design):"; echo "$bad $big"; exit 1; fi
      - name: injection-recovery protocol (eta_P)
        run: python etap.py selftest
      - name: target registry
        run: python targets.py selftest
      - name: cross-star RFI database
        run: python rfi_db.py selftest
      - name: fast single-read search (pure numpy)
        run: FASTSEARCH_NO_NUMBA=1 python fastsearch.py selftest
      - name: fast search recovery + compare tools
        run: |
          FASTSEARCH_NO_NUMBA=1 python fastsearch_recovery.py selftest
          python fastsearch_compare.py selftest
      - name: forced cadence check
        run: python cadence_forced.py selftest
      - name: coarse-channel alignment
        run: python coarse_align.py selftest
      - name: one-command cadence run (built-in ON/OFF filter)
        run: FASTSEARCH_NO_NUMBA=1 python fastsearch_cadence.py selftest
      - name: periodicity search
        run: python periodicity.py selftest
      - name: multi-epoch census
        run: python tools/epoch_census.py selftest
      - name: cross-epoch matching and star-frame stacking
        run: |
          FASTSEARCH_NO_NUMBA=1 python xepoch.py selftest
          FASTSEARCH_NO_NUMBA=1 python stack.py selftest
      - name: archive selection rules
        run: python bl_archive.py selftest
      - name: signal planting and fair matching
        run: python inject.py selftest
      - name: cache the Voyager 1 calibration file (50 MB, public BL data)
        uses: actions/cache@v4
        with:
          path: data/Voyager1.single_coarse.fine_res.h5
          key: voyager1-single-coarse-fine-res
      - name: fetch Voyager 1 if not cached
        run: test -s data/Voyager1.single_coarse.fine_res.h5 || python fetch_public_data.py voyager
      - name: Earth drift vs Voyager 1
        run: python earth_term.py gate
      - name: reach vs Enriquez 2017 Table 3
        run: python reach.py
      - name: coherence detector
        run: python coherence.py selftest
      - name: recipe framework
        run: python cookbook.py selftest
      - name: novel detectors
        run: python agent.py selftest
